name: sieve
version: "0.1.0"
description: SIEVE — a user-owned notification boundary. Tiers, quiet hours, and a phone alarm only when the TeamShift app is open and you turn the phone arm on. No location or calendar read.
provides_tools:
  - sieve_ping
provides_hooks:
  - on_human_input_request
  - on_human_input_resolved
  - kanban_task_blocked
  - subagent_stop
  - on_session_end
  - post_approval_response
